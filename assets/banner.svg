<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(6, 182, 212, 0.3)"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .animated-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .animated-scan {
      animation: scan 6s linear infinite;
    }
    .animated-float {
      animation: float 5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); }
      50% { transform: translateY(220px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" rx="16" fill="url(#techGrid)"/>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Positioned safely away or in subtle opacity) -->
  
  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glowPurple)" class="animated-pulse"/>
  <circle cx="1050" cy="240" r="160" fill="#a855f7" opacity="0.12" filter="url(#glowPurple)" class="animated-pulse"/>
  
  <!-- Decorative AR Target Rectangles on the Right (Dynamic Aspect) -->
  <g transform="translate(860, 45)" class="animated-float">
    <!-- Holographic 3D Box Wireframe -->
    <rect x="0" y="0" width="260" height="230" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="url(#cyanGradient)" stroke-width="1.5" filter="url(#glowCyan)"/>
    <path d="M 30 50 L 130 20 L 230 50 L 130 80 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M 30 50 L 30 170 L 130 200 L 130 80" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M 230 50 L 230 170 L 130 200" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M 130 20 L 130 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Step Pointer Callout Card (AR In-Situ HUD Element) -->
    <rect x="140" y="110" width="100" height="45" rx="6" fill="rgba(30, 41, 59, 0.85)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="150" y="128" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="700">STEP 03: ALIGN</text>
    <text x="150" y="143" fill="#e2e8f0" font-family="sans-serif" font-size="9">Torque 15 Nm [OK]</text>
    
    <!-- AR Corner Crosshairs -->
    <path d="M -10 10 L 10 10 M 10 -10 L 10 10" stroke="#06b6d4" stroke-width="3" transform="translate(15, 15)"/>
    <path d="M -10 -10 L 10 -10 M -10 10 L -10 -10" stroke="#06b6d4" stroke-width="3" transform="translate(245, 215)"/>
  </g>

  <!-- Scanning Laser Line (AR Spatial Scanning Simulation) -->
  <line x1="840" y1="40" x2="1140" y2="40" stroke="#06b6d4" stroke-width="2" opacity="0.6" filter="url(#glowCyan)" class="animated-scan"/>

  <!-- FOREGROUND CONTENT CARD (Guarantees titles stay crystal clear and unhidden) -->
  <g transform="translate(50, 45)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="290" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#06b6d4" class="animated-pulse"/>
    <text x="30" y="21" class="badge-text">INDUSTRIAL AR &amp; SPATIAL GUIDANCE</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title">
      Awesome AR Work Instructions 🥽 ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle">
      Curated Enterprise SaaS Platforms &amp; Open-Source AR Guidance Tools
    </text>

    <!-- Feature Pills in HUD Foreground -->
    <g transform="translate(0, 155)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="12" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">📍 In-Situ Authoring</text>
      
      <!-- Pill 2 -->
      <rect x="177" y="0" width="180" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="189" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🛠️ Step-by-Step Training</text>

      <!-- Pill 3 -->
      <rect x="369" y="0" width="185" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="381" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">👓 HoloLens &amp; Mobile XR</text>
    </g>
  </g>
</svg>
